name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: open-policy-agent/setup-opa@v2
        with: { version: latest }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Policy unit tests and formatting
        run: |
          opa test policy -v
          opa fmt --fail -d policy/aurai
      - name: Connector security reviews and policy references
        run: aurai-connectors check
      - run: pytest -q
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aurai-connectors:ci .
      - name: The image carries the manifests and passes its own checks
        run: docker run --rm aurai-connectors:ci check